name: Deploy Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The API check compares with the report at the last release tag, so it needs the tags.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # npm ci: install exactly the lockfile, and fail if it is out of step with package.json.
      # Needs npm 11+ (Node 24): npm 10 resolves this lockfile's peer dependencies differently.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build Library
        run: npm run build

      # The public API (STABILITY.md): the committed report must match the built declarations,
      # and a breaking change since the last release fails unless the major version went up.
      - name: API check
        run: npm run api:check

      - name: Generate API Docs (TypeDoc)
        run: npm run docs:generate

      - name: Build VitePress Docs
        run: npm run docs:build

      - name: Build Demo
        run: npm run demo:build

      - name: Copy demo into docs dist
        run: |
          mkdir -p docs-site/.vitepress/dist/demo
          cp -r docs/. docs-site/.vitepress/dist/demo/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs-site/.vitepress/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
